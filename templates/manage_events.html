<!DOCTYPE html>

<html lang="en">
    <head>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4" crossorigin="anonymous"></script>
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500&display=swap" rel="stylesheet">
        <link href="/static/style.css" rel="stylesheet">
        <title>VEX V5 Events</title>
    </head>
    <body>

        <nav class = "navbar navbar-expand-md navbar-light bg-light border">
            <ul class = "navbar-nav mr-auto mt-2">
                <div class = "nav-item">
                    <a class = "nav-link" href = "/">
                        <img src = "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQw8S1EBg_kxFe075euMxqX1D9NJEbyJaenbw&s" alt = "Homepage" width = "50" height = "30">
                    </a>
                </div>
                <div class = "right">
                    <a class = "nav-link" href = "/manage_events">
                        Add/Change Event
                    </a>
                </div>
            </ul>
        </nav>

        <div class="header">
            <img src = "https://upload.wikimedia.org/wikipedia/commons/3/38/Vex-Logo.jpg" alt = "VEX Robotics Logo" width = "375" height = "225">
            <h1>VEX V5 Events</h1>
        </div>

        <div class="container">
            <div class="section">

                <h2>Add Event</h2>
                <form action = "/manage_events" method = "post">
                    <input name = "name" placeholder = "Name" type = "text">
                    <input name = "date" placeholder = "Start Date" type = "text">
                    <input name = "place" placeholder = "Place" type = "text">
                    <input type = "submit" value = "Add Event">
                </form>
            </div>
        </div>

        <div class = "container">
            <div class = "section">
                <h2> Edit Event </h2>
                <form action = "/edit_events" method = "post">
                    <input name = "input_name" placeholder = "Name" type = "text">
                    <input type = "submit" value = "Edit this Event">
                </form>

                {% for event in events %}
                <form action = "/update_event" method = "post">
                    <input name = "name_change" placeholder = "Name" type = "text" value = "{{ event['Name'] }}">
                    <input name = "date_change" placeholder = "Start Date"  type = "text" value = "{{ event['Date'] }}">
                    <input name = "place_change" placeholder = "Place"  type = "text" value = "{{ event['Place'] }}">
                    <input type = "submit" value = "Update">
                </form>
                {% endfor %}

            </div>
        </div>

    </body>
</html>
